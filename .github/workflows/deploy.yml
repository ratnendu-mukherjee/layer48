name: Deploy website to IIS

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    # Skipped until the FTP_SERVER repository variable is configured.
    if: vars.FTP_SERVER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload website over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # "loose" accepts a self-signed certificate on the FTP site.
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./website/
          server-dir: ./
